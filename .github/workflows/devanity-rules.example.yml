# devanity — reference CI job for a repository that has a devanity.rules.json (SPEC §7.5).
# Copy this file into your repository's .github/workflows/ and pin DEVANITY_REF.
#
# What it does on every pull request: validates devanity.rules.json, checks the per-path delta
# budgets of the diff, runs the `check` of every touched high-risk path, and requires a
# `devanity-proof:` block in the PR body when the diff touches a normal or high-risk path.
# The devanity repository itself dogfoods the same script in --self-check mode from validate.yml.

name: devanity-rules

on:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    # This job lives in the plugin repository as an example; remove the `if` in your copy.
    if: github.repository != 'usedevanity/skills'
    env:
      # Pin to a full 40-character commit sha of the plugin (or a release tag, once one exists) before relying on this job.
      DEVANITY_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Add here the setup steps your declared checks need (the same ones your existing CI uses:
      # a language toolchain, a service container). The job runs those checks on this runner.
      - name: Fetch the devanity plugin
        # A fetch by ref works for a branch, a tag and a commit sha alike (`clone --branch` takes no sha).
        run: |
          dir="$RUNNER_TEMP/devanity"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/usedevanity/skills "$DEVANITY_REF"
          git -C "$dir" checkout -q FETCH_HEAD
      - name: devanity rules
        # The PR body is read from the event payload (GITHUB_EVENT_PATH); no extra input needed.
        run: node "$RUNNER_TEMP/devanity/scripts/devanity-rules-ci.mjs" --base "origin/${{ github.base_ref }}"
