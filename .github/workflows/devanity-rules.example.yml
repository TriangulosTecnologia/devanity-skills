# devanity — reference CI job for a repository that has a devanity.rules.json (SPEC §7.5).
# Copy this file into your repository's .github/workflows/ and pin DEVANITY_REF.
#
# What it does on every pull request: validates devanity.rules.json, checks the per-path delta
# budgets of the diff, runs the `check` of every touched high-risk path, and requires a
# `devanity-proof:` block in the PR body when the diff touches a normal or high-risk path.
# The devanity repository itself dogfoods the same script in --self-check mode from validate.yml.

name: devanity-rules

on:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    # This job lives in the plugin repository as an example; remove the `if` in your copy.
    if: github.repository != 'TriangulosTecnologia/devanity-skills'
    env:
      # Pin to a release tag or a commit sha of the plugin before relying on this job.
      DEVANITY_REF: main
      DEVANITY_PLUGIN_DIR: ${{ runner.temp }}/devanity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the devanity plugin
        run: git clone --depth 1 --branch "$DEVANITY_REF" https://github.com/TriangulosTecnologia/devanity-skills "$DEVANITY_PLUGIN_DIR"
      - name: devanity rules
        # The PR body is read from the event payload (GITHUB_EVENT_PATH); no extra input needed.
        run: node "$DEVANITY_PLUGIN_DIR/scripts/devanity-rules-ci.mjs" --base "origin/${{ github.base_ref }}"
